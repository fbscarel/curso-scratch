# The sala's game catalogue.
#
# `rom` is relative to the ROM directory (SALA_ROMS, default /mnt/z/roms) and can
# never leave it. `core` is the EmulatorJS 4.2.3 core id (the same one as the
# emulador.sha256 manifest). `controls` are the real keys the emulator uses
# (player 1): arrows, x = B/fire, z = A, s = Y, a = X, q/e = L/R,
# v = SELECT (coin on the arcade), Enter = START (reset on the Atari).
#
# A `builtin` jogo has no `system`, `core` or `rom`: it is our own page (Pong),
# and its `controls` are the keys that page listens to.
#
# `score` tells the game page where to read the score inside the emulator's
# savestate: the score bytes, most significant first (packed BCD in `bcd`, one
# digit per byte in `digits`), a multiplier for the digits the game does not
# store, and the byte (or bytes) that say the match has started. Only emulated
# games can have one.
#
# `capa` is the name of the game's cover at libretro-thumbnails, for the games
# whose ROM file name is not what is written on the box -- the arcade sets, whose
# file is named after the MAME set. Without it, the cover is looked up by the ROM
# file name. `just sala-capas` downloads the covers; no image is tracked here.
#
# This file is read and checked when the server starts: an error here shows up
# in Portuguese naming the file and the entry, and the server does not start.

- id: pong
  title: Pong
  type: builtin
  year: 1972
  maker: Atari
  about: "Bate-bola do começo dos videogames: rebata a bola com a raquete e não deixe passar."
  controls:
    - {keys: ["↑", "↓", "W", "S"], action: "mover a raquete"}
    - {keys: ["P"], action: "pausar"}

- id: enduro
  title: Enduro
  type: emulated
  system: atari2600
  core: stella2014
  rom: "atari2600/Enduro (USA).zip"
  # The 6-digit odometer is little endian in RAM ($A8..$AA, i.e. state
  # $A4..$A6, least significant first); $90 is 0x00 on the attract/title
  # screen and 0xff once the race runs.
  score:
    bcd: [0xA6, 0xA5, 0xA4]
    multiplier: 1
    in_game: {offset: 0x90, is: 0xFF}
  year: 1983
  maker: Activision
  about: "Corrida de resistência: ultrapasse os carros e aguente o dia e a noite."
  controls:
    - {keys: ["←", "→"], action: "virar"}
    - {keys: ["x"], action: "acelerar"}
    - {keys: ["↓"], action: "frear"}
    - {keys: ["v"], action: "escolher a variação (select)"}
    - {keys: ["Enter"], action: "recomeçar (reset)"}

- id: space-invaders
  title: Space Invaders
  type: emulated
  system: atari2600
  core: stella2014
  rom: "atari2600/Space Invaders (USA).zip"
  # Dois pares BCD na RAM: $E6 (dezena de milhar e milhar) e $E8 (centena e
  # dezena), ou seja, o estado $E2 e $E4, do mais significativo para o menos.
  # Dois bytes separam a demonstração da partida: $AA (estado $A6) é 0x80 na
  # demonstração e 0x00/0x01/0x04 com a partida rodando, e $E5 (estado $E1) é o
  # latch de fim de jogo — 0x00 enquanto a partida roda, mortes incluídas, e
  # 0x80 quando as vidas acabam. Na demonstração os bytes da pontuação são
  # 0xAA/0xA1, que não são BCD.
  score:
    bcd: [0xE2, 0xE4]
    multiplier: 1
    in_game:
      all:
        - {offset: 0xA6, not: 0x80}
        - {offset: 0xE1, not: 0x80}
  year: 1980
  maker: Atari
  about: "Defenda a Terra: derrube a fileira de alienígenas antes que ela desça."
  controls:
    - {keys: ["←", "→"], action: "mover"}
    - {keys: ["x"], action: "atirar"}
    - {keys: ["v"], action: "escolher a variação (select)"}
    - {keys: ["Enter"], action: "recomeçar (reset)"}

- id: river-raid
  title: River Raid
  type: emulated
  system: atari2600
  core: stella2014
  rom: "atari2600/River Raid (USA).zip"
  # Uma casa decimal por byte, da mais significativa para a menos, na RAM
  # $CD..$D7 (estado $C9..$D3): o byte é o dígito três bits acima (código =
  # dígito << 3) e 0x58 é a casa vazia (zero à esquerda).
  #
  # A partida está rodando quando a casa das vidas (RAM $C0, estado $BC) não
  # está vazia — 0x58 na demonstração e depois da última vida — nem zerada:
  # nos primeiros quadros depois de ligar a casa ainda é 0x00, e a memória já
  # guarda a pontuação `_____1` da demonstração, o que bastaria para o site
  # anotar 1 ponto sozinho.
  score:
    digits: [0xC9, 0xCB, 0xCD, 0xCF, 0xD1, 0xD3]
    digit_shift: 3
    blank: 0x58
    multiplier: 1
    in_game:
      all:
        - {offset: 0xBC, not: 0x58}
        - {offset: 0xBC, not: 0x00}
  year: 1982
  maker: Activision
  about: "Voe pelo rio, destrua os inimigos e não deixe o combustível acabar."
  controls:
    - {keys: ["←", "→"], action: "virar"}
    - {keys: ["↑"], action: "acelerar"}
    - {keys: ["↓"], action: "frear"}
    - {keys: ["x"], action: "atirar"}
    - {keys: ["v"], action: "escolher a variação (select)"}
    - {keys: ["Enter"], action: "recomeçar (reset)"}

- id: pitfall
  title: Pitfall!
  type: emulated
  system: atari2600
  core: stella2014
  rom: "atari2600/Pitfall! - Pitfall Harry's Jungle Adventure (USA).zip"
  # Três pares BCD, do mais significativo para o menos, na RAM $D5..$D7
  # (estado $D1..$D3). $9E (estado $9A) é 0x00 enquanto o jogo roda o quadro do
  # jogador, mas corre sozinho durante a morte; a marcha fúnebre ($E0, estado
  # $DC) é o que diz que a morte está em andamento — por isso a condição aceita
  # qualquer um dos dois.
  score:
    bcd: [0xD1, 0xD2, 0xD3]
    multiplier: 1
    in_game:
      any:
        - {offset: 0x9A, is: 0x00}
        - {offset: 0xDC, not: 0x00}
  year: 1982
  maker: Activision
  about: "Aventura na selva: corra, pule nos troncos e junte os tesouros."
  controls:
    - {keys: ["←", "→"], action: "correr"}
    - {keys: ["↑"], action: "subir a escada"}
    - {keys: ["↓"], action: "descer a escada ou a corda"}
    - {keys: ["x"], action: "pular"}
    - {keys: ["v"], action: "escolher a variação (select)"}
    - {keys: ["Enter"], action: "recomeçar (reset)"}

- id: kaboom
  title: Kaboom!
  type: emulated
  system: atari2600
  core: stella2014
  rom: "atari2600/Kaboom! (USA).zip"
  # Três pares BCD, do mais significativo para o menos, na RAM $A3..$A5
  # (estado $9F..$A1) — na tela de ligar ela já vale 0x01, o número de
  # jogadores. O contador de baldes ($A1, estado $9D) é o que diz que a partida
  # está rodando: 0 na tela de ligar e depois do GAME OVER, e 3/2/1 do RESET
  # até a última explosão — nas ondas, na pausa à espera do botão de tiro e
  # enquanto um balde se perde. O estado do jogo (RAM $AD) não serve para isso:
  # ele é justamente 0x00 na tela de ligar e só fica 0xFF à espera do tiro.
  # Contador e pontuação são do jogador da vez: na variação de dois jogadores
  # o jogo troca os dois a cada balde perdido, então uma partida a dois vira um
  # só registro (o de quem perdeu o último balde) — e aqui ela nem anda, porque
  # nenhuma tecla é o botão do jogador 2. A turma joga a variação de um jogador.
  # SELECT (v) no meio da partida também zera o contador: os pontos feitos até
  # ali vão para o placar, como se a partida tivesse acabado.
  score:
    bcd: [0x9F, 0xA0, 0xA1]
    multiplier: 1
    in_game: {offset: 0x9D, not: 0x00}
  year: 1981
  maker: Activision
  about: "Pegue as bombas do bombardeiro maluco com os baldes antes que elas explodam."
  controls:
    - {keys: ["←", "→"], action: "mover os baldes"}
    - {keys: ["x"], action: "começar a rodada"}
    - {keys: ["v"], action: "escolher a variação (select)"}
    - {keys: ["Enter"], action: "recomeçar (reset)"}

- id: frogger
  title: Frogger
  type: emulated
  system: arcade
  core: mame2003_plus
  rom: "arcade/frogger.zip"
  capa: "Frogger"
  # The 1-UP score keeps four BCD digits, the tens and up: the units cell of the
  # HUD is a constant 0 with no RAM source, so what the game stores is a tenth of
  # the score. $454C is the PLAY_FLAG: 0 in the attract demo, which writes a
  # score into the same bytes.
  score:
    bcd: [0x453C, 0x453B]
    multiplier: 10
    in_game: {offset: 0x454C, not: 0x00}
  year: 1981
  maker: Konami
  about: "Ajude a rã a atravessar a rua e o rio sem ser atropelada."
  controls:
    - {keys: ["←", "→", "↑", "↓"], action: "pular para o lado"}
    - {keys: ["v"], action: "colocar a ficha (coin)"}
    - {keys: ["Enter"], action: "começar a partida (start)"}

- id: galaga
  title: Galaga
  type: emulated
  system: arcade
  core: mame2003_plus
  rom: "arcade/galaga.zip"
  capa: "Galaga (Namco rev. B)"
  # Uma casa decimal por byte (código de caractere do Namco, 0x00..0x09), da
  # mais significativa para a menos; 0x24 é a casa vazia. A pontuação fica na
  # memória do tilemap e sobrevive ao fim de jogo (as telas de GAME OVER ainda
  # mostram a última pontuação), então o flag é o que separa a partida da
  # demonstração: $1CEEE é 0x01 só com a ficha em jogo.
  score:
    digits: [0x1C2D9, 0x1C2D8, 0x1C2D7, 0x1C2D6, 0x1C2D5, 0x1C2D4]
    blank: 0x24
    multiplier: 1
    in_game: {offset: 0x1CEEE, is: 0x01}
  year: 1981
  maker: Namco
  about: "Nave espacial: derrube as naves inimigas e resgate a sua nave capturada."
  controls:
    - {keys: ["←", "→"], action: "mover"}
    - {keys: ["x"], action: "atirar"}
    - {keys: ["v"], action: "colocar a ficha (coin)"}
    - {keys: ["Enter"], action: "começar a partida (start)"}

- id: ms-pac-man
  title: Ms. Pac-Man
  type: emulated
  system: arcade
  core: mame2003_plus
  rom: "arcade/mspacman.zip"
  capa: "Ms. Pac-Man"
  # Três pares BCD, do mais significativo para o menos (na RAM do Z80 eles
  # ficam na ordem inversa: $4E82, $4E81, $4E80). $4EBD é o modo de jogo: 1 na
  # demonstração, 2 com a ficha posta ou no fim de jogo, 3 na partida — ele
  # continua 3 durante uma morte.
  score:
    bcd: [0x4F3F, 0x4F3E, 0x4F3D]
    multiplier: 1
    in_game: {offset: 0x4EBD, is: 0x03}
  year: 1982
  maker: Midway
  about: "Coma todas as pastilhas do labirinto fugindo dos fantasmas."
  controls:
    - {keys: ["←", "→", "↑", "↓"], action: "andar"}
    - {keys: ["v"], action: "colocar a ficha (coin)"}
    - {keys: ["Enter"], action: "começar a partida (start)"}

- id: donkey-kong
  title: Donkey Kong
  type: emulated
  system: arcade
  core: mame2003_plus
  rom: "arcade/dkong.zip"
  capa: "Donkey Kong (US set 1)"
  # Três pares BCD, do mais significativo para o menos. $6041 é o modo de jogo:
  # 0x01 com a partida do jogador rodando (e na tela de GAME OVER dela), 0x00 na
  # demonstração e na tela de PUSH START — onde a pontuação que a demonstração
  # deixou no mostrador (3700) ainda está na memória. $6001, que fica ao lado do
  # mostrador de fichas, é o número de fichas e não o modo: com uma ficha só ele
  # é 0x00 a partida inteira.
  score:
    bcd: [0x0202, 0x0201, 0x0200]
    multiplier: 1
    in_game: {offset: 0x018F, is: 0x01}
  year: 1981
  maker: Nintendo
  about: "Suba as escadas, desvie dos barris e salve a moça do Kong."
  controls:
    - {keys: ["←", "→", "↑", "↓"], action: "andar e subir escada"}
    - {keys: ["x"], action: "pular"}
    - {keys: ["v"], action: "colocar a ficha (coin)"}
    - {keys: ["Enter"], action: "começar a partida (start)"}

