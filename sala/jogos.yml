# The sala's game catalogue.
#
# `rom` is relative to the ROM directory (SALA_ROMS, default /mnt/z/roms) and can
# never leave it. `core` is the EmulatorJS 4.2.3 core id (the same one as the
# emulador.sha256 manifest). `controls` are the real keys the emulator uses
# (player 1): arrows, x = B/fire, z = A, s = Y, a = X, q/e = L/R,
# v = SELECT (coin on the arcade), Enter = START (reset on the Atari).
#
# This file is read and checked when the server starts: an error here shows up
# in Portuguese naming the file and the entry, and the server does not start.

- id: enduro
  title: Enduro
  type: emulated
  system: atari2600
  core: stella2014
  rom: "atari2600/Enduro (USA).zip"
  year: 1983
  maker: Activision
  about: "Corrida de resistência: ultrapasse os carros e aguente o dia e a noite."
  controls:
    - {keys: ["←", "→"], action: "virar"}
    - {keys: ["x"], action: "acelerar"}
    - {keys: ["↓"], action: "frear"}
    - {keys: ["v"], action: "escolher a variação (select)"}
    - {keys: ["Enter"], action: "recomeçar (reset)"}

