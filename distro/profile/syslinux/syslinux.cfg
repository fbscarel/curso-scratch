UI menu.c32
MENU TITLE ScratchLab
MENU CLEAR
DEFAULT ram
TIMEOUT 50

LABEL ram
MENU LABEL ScratchLab (copiar para RAM, pode tirar o pendrive)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=1G copytoram=y quiet splash plymouth.use-simpledrm cfg80211.ieee80211_regdom=BR loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

LABEL usb
MENU LABEL ScratchLab (rodar do pendrive, pouca RAM)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=1G copytoram=n quiet splash plymouth.use-simpledrm cfg80211.ieee80211_regdom=BR loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0
