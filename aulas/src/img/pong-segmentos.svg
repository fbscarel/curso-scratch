<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" font-family="Noto Sans, DejaVu Sans, sans-serif">
  <!-- raquete dividida em 9 zonas; topo = bola mais alta que o centro -->
  <g stroke="#222" stroke-width="2" font-size="17" font-weight="bold" text-anchor="middle">
    <rect x="200" y="10" width="90" height="32" fill="#eef4fd"/>
    <rect x="200" y="42" width="90" height="32" fill="#ffffff"/>
    <rect x="200" y="74" width="90" height="32" fill="#eef4fd"/>
    <rect x="200" y="106" width="90" height="32" fill="#ffffff"/>
    <rect x="200" y="138" width="90" height="32" fill="#ffe9a8"/>
    <rect x="200" y="170" width="90" height="32" fill="#ffffff"/>
    <rect x="200" y="202" width="90" height="32" fill="#eef4fd"/>
    <rect x="200" y="234" width="90" height="32" fill="#ffffff"/>
    <rect x="200" y="266" width="90" height="32" fill="#eef4fd"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="245" y="32" fill="#1f5fbf">+4</text>
    <text x="245" y="64" fill="#1f5fbf">+3</text>
    <text x="245" y="96" fill="#1f5fbf">+2</text>
    <text x="245" y="128" fill="#1f5fbf">+1</text>
    <text x="245" y="160" fill="#222">0</text>
    <text x="245" y="192" fill="#c0392b">-1</text>
    <text x="245" y="224" fill="#c0392b">-2</text>
    <text x="245" y="256" fill="#c0392b">-3</text>
    <text x="245" y="288" fill="#c0392b">-4</text>
  </g>
  <!-- retorno: meio reto, pontas inclinadas -->
  <g stroke="#222" stroke-width="3" fill="none" marker-end="url(#ponta)">
    <line x1="192" y1="26" x2="104" y2="6"/>
    <line x1="192" y1="154" x2="96" y2="154"/>
    <line x1="192" y1="282" x2="104" y2="302"/>
  </g>
  <defs>
    <marker id="ponta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
  <circle cx="196" cy="26" r="7" fill="#222"/>
  <circle cx="196" cy="154" r="7" fill="#222"/>
  <circle cx="196" cy="282" r="7" fill="#222"/>
  <text x="150" y="176" font-size="15" fill="#555" text-anchor="middle">o vy que sai</text>
</svg>
