aulas:
  - numero: 1
    titulo: O computador e o nosso primeiro programa
    data: 2026-09-29
    resumo:
      - "As partes do computador por fora (monitor, gabinete, teclado, mouse, caixas de som) e por dentro: o processador é o **cérebro**, a memória RAM é a **mesa de estudo** e o armazenamento é o **armário**."
      - "O caminho da informação: **entrada → processamento → saída**."
      - "Um **programa** é uma lista de instruções, em ordem. O computador faz exatamente o que mandamos — nem mais, nem menos!"
      - "O nosso primeiro programa no Scratch: o gato anda, diz **Olá, mundo!** e mia."
    projeto: Aula1-TreinoDoMouse
    projeto_descricao: "Treino do mouse: estoure os balões, abra os presentes e leve as frutas até a tigela."
  - numero: 2
    titulo: Onde está o gato? Coordenadas no Scratch
    data: 2026-10-02
    resumo:
      - "Para achar um lugar precisamos de **dois números**: primeiro o **x** (para o lado), depois o **y** (para cima ou para baixo)."
      - "**Números negativos** ficam antes do zero, como no termômetro e no subsolo do elevador."
      - "O palco do Scratch vai de **-240 a 240** no x e de **-180 a 180** no y. O gato começa no centro: **(0, 0)**."
      - "Mover o gato com as **setas do teclado** usando o bloco `adicione 10 a x`."
    projeto: Aula2-CacaAsCoordenadas
    projeto_descricao: "Caça às coordenadas: descubra o x e o y da estrela e ganhe pontos."
  - numero: 3
    titulo: "Pega-frutas: o nosso primeiro jogo"
    data: 2026-10-06
    resumo:
      - "Jogamos o **Kaboom!** (Activision, 1981) na Sala e conhecemos um pouco da história dele."
      - "A tigela **segue o mouse** para os lados: o x dela é o **x do mouse**, e o y fica sempre em **-150**."
      - "Para a fruta **cair**, o y **diminui**: `adicione -5 a y`. Ela nasce no alto, num x **sorteado** com o bloco `número aleatório`."
      - "Uma **variável** é uma **caixa com nome** que guarda um número: a nossa se chama **pontos**."
    projeto: Aula3-PegaFrutas
    projeto_descricao: "Pega-frutas: o fundo, a tigela e a fruta (com 5 fantasias) prontos para você programar."
  - numero: 4
    titulo: "Pong: a bola e as raquetes"
    data: 2026-10-09
    resumo:
      - "Jogamos o **Pong** na Sala e vimos os primeiros videogames: *Tennis for Two* (1958), *Spacewar!* (1962) e o Pong (1972)."
      - "A bola anda sozinha com **duas variáveis**: **vx** (para os lados) e **vy** (para cima e para baixo)."
      - "Bateu numa parede? A velocidade **troca de sinal**: `mude vy para 0 - vy`."
      - "Com `sempre` + `se tecla w pressionada? então` a raquete anda **sem engasgar**, e dá para jogar **em dupla** no mesmo teclado."
    projeto: Aula4-Pong
    projeto_descricao: "Pong: a quadra com a rede, as duas raquetes e a bola, prontas para você programar."
  - numero: 5
    titulo: "Pong: o placar e as regras"
    data: 2026-11-03
    resumo:
      - "Jogamos o Pong em dupla e lemos o script da **Bola**: o `bola_centro` e as variáveis **vx** e **vy**, que são **só da Bola**."
      - "História: o **Magnavox Odyssey** (1972), o primeiro console de casa, e o **Home Pong** da Atari (1975), que levou o Pong para a sala."
      - "O jogo agora **acaba aos 7**: o `fim_jogo (jogador)` mostra *Vitória do jogador 1* por **2 segundos** e para tudo com `pare todos` — sem esse tempo, o `pare` apagaria o balão de fala."
      - "A bola **acelera a cada rebatida**: `adicione 1 a vx` depois da Raquete1 e `adicione -1 a vx` depois da Raquete2 — o **sinal** do vx diz para onde a bola vai."
    projeto: Aula5-PongInicio
    projeto_descricao: "Pong: o placar dos dois jogadores e o saque do meio prontos — falta a vitória aos 7 e a bola acelerando."
  - numero: 6
    titulo: "Melodias: o computador toca música"
    data: 2026-11-06
    resumo:
      - "Jogamos o **Super Mario Bros.** na Sala e descobrimos como o console tocava música: um **chip de som** com **cinco canais**, e **Koji Kondo** escrevendo a musiquinha mais famosa dos videogames."
      - "No teclado, as **sete notas** com os dois nomes (**dó = C** … **si = B**) e o número que diz a **oitava** (o **C4** é o dó do meio)."
      - "Contamos a **batida** em 4/4 e montamos uma **melodia** no **Compositor** (danielx.net): **clique** na pauta põe a nota, **clique de novo** tira; **Export** sai o **MP3** e **Save to disk** a partitura (`.midi`)."
      - "No Scratch, o MP3 entra na **Bailarina** e ela **dança na batida** com `espere (0.5) seg` — meio segundo é uma batida a 120 bpm."
    projeto: Aula6-Melodias
    projeto_descricao: "Melodias: o palco e a Bailarina prontos para você importar a sua música e fazer ela dançar no ritmo."
  - numero: 7
    titulo: "Batidas: a bateria da sua música"
    data: 2026-11-10
    resumo:
      - "Abrimos o **nosso** projeto da Aula 6 em **Meus arquivos** e provamos que dá para tocar **melodia e bateria juntas** — se as duas têm o mesmo andamento, compasso e começo."
      - "História: a caixa de ritmos **Roland TR-808** (1980) e as **amostras** (samples) do hip-hop."
      - "No **Hydrogen**, desenhamos a batida numa **grade** (bumbo, caixa, chimbal), fizemos a **virada** num segundo padrão e enfileiramos oito compassos na **canção**."
      - "**Projeto → Exportar Canção** (MP3) e **Salvar Como...** (`.h2song`); no Scratch, a batida entra na **Bateria** e as duas músicas começam na bandeira verde."
    projeto: Aula7-Batidas
    projeto_descricao: "Batidas: o palco, a Bailarina e a Bateria prontos para você importar a sua batida e tocar as duas músicas juntas."
